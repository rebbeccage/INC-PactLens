<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>INC Lens · 案文工作区</title><link rel="stylesheet" href="workspace.css?v=revision-word-1"><link rel="stylesheet" href="ui.css?v=quiet-2"></head>
<body>
<header class="toolbar"><a class="back" id="backHome" href="./?return=1" aria-label="返回首页选择案文">← <span>INC Lens</span></a><div class="versionbar" aria-label="比较文件"><label>左<select id="leftVersion" aria-label="选择左侧案文"></select></label><label>右<select id="rightVersion" aria-label="选择右侧案文"></select></label></div><div class="tabs" role="tablist" aria-label="工作模式"><button data-view="compare" role="tab">对照模式</button><button data-view="research" role="tab">修订模式</button></div><div class="toolbar-actions"><div id="revisionActions" class="revision-actions" hidden><button id="cleanPreview" aria-pressed="false">清理预览</button><button id="exportWord" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">导出 Word</button></div><button id="settingsToggle" class="icon-button" aria-label="阅读和对照设置" aria-expanded="false" aria-controls="settings">•••</button></div></header>
<div id="operationbar" class="operationbar"><button id="articleToggle" aria-controls="articlePanel" aria-expanded="false">全文 ⌄</button><div class="topic-field"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="中英文搜索" aria-label="搜索议题、条款或原文" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="topicResults" autocomplete="off"></div><nav id="differenceNav" aria-label="差异定位" hidden><button id="prev" aria-label="上一处差异">↑</button><span id="position" aria-live="polite"></span><button id="next" aria-label="下一处差异">↓</button></nav><button id="summaryToggle" aria-controls="summaryPanel" aria-expanded="false">有什么区别</button></div>
<section id="searchPanel" class="lens-panel search-results" aria-label="主题检索结果" hidden><div class="panel-head"><span id="resultCount" role="status"></span><button id="closeSearch" aria-label="关闭搜索结果">×</button></div><div id="topicResults" role="listbox"></div><div hidden><button id="searchToggle" aria-expanded="false"></button><span id="searchCount"></span><button id="searchPrev"></button><button id="searchNext"></button></div></section>
<section id="articlePanel" class="lens-panel article-panel" aria-label="联动条款选择" hidden><div class="panel-head"><input id="articleSearch" placeholder="条款标题或编号" aria-label="搜索联动条款"><button id="closeArticles" aria-label="关闭联动条款">×</button></div><nav id="articleResults" aria-label="选择比较条款"></nav></section>
<section id="summaryPanel" class="lens-panel summary-panel" role="dialog" aria-modal="false" aria-labelledby="summaryTitle" hidden><div class="panel-head"><h2 id="summaryTitle">有什么区别</h2><span id="summaryDirection" class="summary-direction" title="以右稿为基准：仅右侧有的为删除，仅左侧有的为新增，同一处同时有增删为表述替换。">右 → 左</span><button id="closeSummary" aria-label="关闭有什么区别">×</button></div><div id="summaryContent"></div></section>
<div id="settings" class="popover settings" hidden><div id="researchControls"><label><input type="checkbox" id="showEdits" checked>显示修订</label></div><div id="compareControls" hidden><label><input type="checkbox" id="onlyChanges">仅看改动</label></div><label><input type="checkbox" id="sync">同步滚动</label><button id="reset">等分两栏</button><button id="theme">切换深色外观</button></div>
<div id="exportMenu" class="popover export-menu" role="menu" aria-label="Word 导出选项" hidden><button id="exportTracked" role="menuitem">导出修订版</button><button id="exportClean" role="menuitem">导出清理版</button></div>
<main id="workspace"><section id="leftPane" class="pane" aria-label="左侧研究稿">
 <div class="panehead"><div class="file-identity"><span class="side">左</span><span id="leftMeeting" class="file-meeting"></span><h1 id="leftName"></h1></div><button id="revisionCount" aria-label="查看编辑修订" hidden></button></div>
 <div class="clausebar"><button id="leftClauseToggle" class="clause-toggle" aria-expanded="false" aria-controls="leftOutline" aria-label="左侧条款定位">条款定位 <span>⌄</span></button><span id="leftClauseStatus" class="clause-status"></span><div id="leftLanguageSwitch" class="language-switch" role="group" aria-label="左侧案文语言" hidden><div class="language-options"><button type="button" data-language-side="left" data-language="zh-CN" aria-label="左侧切换至中文" aria-pressed="false">中文</button><button type="button" data-language-side="left" data-language="en" aria-label="左侧切换至英文" aria-pressed="false">EN</button></div></div></div>
 <section id="leftOutline" class="outline" aria-label="左侧条款目录" hidden><div class="outline-search"><input id="leftClauseSearch" type="search" placeholder="标题或编号" aria-label="搜索左侧条款标题"><button id="leftOutlineClose" aria-label="关闭左侧条款目录">×</button></div><div class="outline-summary"><span id="leftClauseCount" role="status"></span><button id="leftDocTop">回到开头 ↑</button></div><nav id="leftClauseList" class="outline-list" aria-label="左侧条款标题"></nav></section>
 <div id="leftDoc" class="document" tabindex="0" aria-label="左侧案文滚动区"><div id="editor" class="prose editable" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-label="可编辑研究稿" spellcheck="false"></div><div id="leftPreview" class="prose" hidden></div><section id="revisionPanel" class="revision-panel" hidden><div class="revision-heading"><strong>编辑修订</strong></div><div id="revisionContent" class="prose"></div></section></div>
</section><div id="splitter" role="separator" tabindex="0" aria-label="调整左右栏宽，Home 或双击恢复等宽" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" aria-controls="leftPane rightPane"><span></span></div><section id="rightPane" class="pane" aria-label="右侧参考原文">
 <div class="panehead"><div class="file-identity"><span class="side">右</span><span id="rightMeeting" class="file-meeting"></span><h2 id="rightName"></h2></div></div>
 <div class="clausebar"><button id="rightClauseToggle" class="clause-toggle" aria-expanded="false" aria-controls="rightOutline" aria-label="右侧条款定位">条款定位 <span>⌄</span></button><span id="rightClauseStatus" class="clause-status"></span><div id="rightLanguageSwitch" class="language-switch" role="group" aria-label="右侧案文语言" hidden><div class="language-options"><button type="button" data-language-side="right" data-language="zh-CN" aria-label="右侧切换至中文" aria-pressed="false">中文</button><button type="button" data-language-side="right" data-language="en" aria-label="右侧切换至英文" aria-pressed="false">EN</button></div></div></div>
 <section id="rightOutline" class="outline" aria-label="右侧条款目录" hidden><div class="outline-search"><input id="rightClauseSearch" type="search" placeholder="标题或编号" aria-label="搜索右侧条款标题"><button id="rightOutlineClose" aria-label="关闭右侧条款目录">×</button></div><div class="outline-summary"><span id="rightClauseCount" role="status"></span><button id="rightDocTop">回到开头 ↑</button></div><nav id="rightClauseList" class="outline-list" aria-label="右侧条款标题"></nav></section>
 <div id="rightDoc" class="document" tabindex="0" aria-label="右侧案文滚动区"><div id="reference" class="prose"></div></div>
</section></main>
<div hidden><span id="wordCount"></span><span id="refCount"></span></div>
<span id="statusMessage" class="sr-only" role="status"></span>
<footer class="app-footer"><span id="saveStatus" role="status"></span><span class="footer-note"><button id="notice" class="info-button" data-hint="" aria-label="查看状态提示" aria-expanded="false" hidden>①</button><span>研究用途 · 以原件为准</span><button id="legalInfo" class="info-button" data-hint="左侧编辑研究稿，右侧查看原文。稿件保存在当前浏览器。" aria-label="查看使用提示" aria-expanded="false">①</button></span></footer>
<script src="model.js?v=text-fix-2"></script><script src="source-documents.js?v=text-fix-2"></script><script src="data.js?v=text-fix-2"></script><script src="clauses.js?v=text-fix-2"></script><script src="layout.js?v=text-fix-2"></script><script src="languages.js?v=three-kinds-1"></script><script src="ui.js?v=quiet-2"></script><script src="meetings.js?v=7"></script><script src="topics.js?v=three-kinds-1"></script><script src="source-pages.js?v=lens-1"></script><script src="source-numbering.js?v=lens-1"></script><script src="research.js?v=three-kinds-1"></script><script src="docx-export.js?v=revision-word-1"></script><script src="app.js?v=revision-word-1"></script></body></html>
