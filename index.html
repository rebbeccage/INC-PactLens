<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="按 INC 会议浏览塑料公约案文，选择左右文件，开始对照。"><title>INC Lens · 会议案文库</title><link rel="stylesheet" href="home.css?v=quiet-2"><link rel="stylesheet" href="ui.css?v=quiet-2"></head>
<body>
<header class="home-nav"><a class="wordmark" href="./" aria-label="INC Lens首页">INC Lens</a><div class="home-actions"><div class="view-switch" aria-label="版本展示方式"><button id="overviewMode" aria-pressed="true">概览</button><button id="indexMode" aria-pressed="false">列表</button></div><button id="import">＋ 上传文件</button><input type="file" id="upload" accept=".txt,.md,text/plain,text/markdown" multiple hidden></div></header>
<nav class="timeline" aria-label="INC 会议筛选"><div id="timeline" role="toolbar" aria-label="按会议筛选案文"></div><div class="timeline-actions"><button id="allMeetings" aria-pressed="false">全部</button></div></nav>
<main id="gallery" class="gallery" aria-label="案文卡片浏览区"><h1 class="sr-only">选择两份案文，开始对照</h1><canvas id="gl" aria-hidden="true"></canvas><div id="fallback" hidden></div><div id="emptyState" hidden><p>暂无案文</p><button id="emptyImport">上传文件</button></div><section id="index" aria-label="案文列表" hidden><div id="indexList"></div></section><div id="dragGhost" aria-hidden="true" hidden></div></main>
<section id="focusInfo" class="focus-info" aria-label="当前案文信息"><div class="title-row"><h2 id="focusedCardName"></h2><button id="detailsToggle" class="info-button" aria-label="查看文件信息" aria-expanded="false" aria-controls="details">①</button></div><div class="meeting-line"><span id="meetingName"></span></div><div class="browse-actions"><button id="previousCard" aria-label="上一份案文">←</button><span id="filePosition"></span><button id="nextCard" aria-label="下一份案文">→</button><button id="chooseFocused">选入左侧</button></div></section>
<section class="selection-dock" aria-label="左右案文选择"><button id="leftSlot" class="selection-slot active" aria-pressed="true"><span class="slot-letter">左</span><span class="slot-text"><strong id="leftSlotName">选择一份案文</strong></span><span class="slot-meeting" id="leftSlotMeeting"></span></button><button id="swap" aria-label="交换左右案文" title="交换左右案文">⇄</button><button id="rightSlot" class="selection-slot" aria-pressed="false"><span class="slot-letter">右</span><span class="slot-text"><strong id="rightSlotName">选择一份案文</strong></span><span class="slot-meeting" id="rightSlotMeeting"></span></button><button id="enterWorkspace" disabled>开始对照 <span>↗</span></button></section>
<footer class="home-footer app-footer"><span id="homeMessage" role="status"></span><span class="footer-note"><span>研究用途 · 以原件为准</span><button id="homeHelp" class="info-button" data-hint="选择左右案文后开始对照。左侧编辑，右侧保留原文。研究稿保存在当前浏览器。" aria-label="查看使用提示" aria-expanded="false">①</button></span></footer>
<dialog id="details" aria-labelledby="detailsTitle"><div class="dialog-head"><h2 id="detailsTitle">文件信息</h2><button id="closeDetails" aria-label="关闭详情">×</button></div><dl id="detailsContent"></dl><label id="associationLabel" hidden>关联会议<select id="association" aria-label="指定文件主要对应会议"></select></label><div class="details-links"><a id="originalFile" download>下载原文件 ↓</a><a id="officialSource" target="_blank" rel="noopener noreferrer">官方会议页面 ↗</a></div></dialog>
<script src="vendor/three.min.js"></script><script src="vendor/gsap.min.js"></script><script src="model.js?v=text-fix-2"></script><script src="source-documents.js?v=text-fix-2"></script><script src="data.js?v=text-fix-2"></script><script src="meetings.js?v=7"></script><script src="languages.js?v=inc-lens-1"></script><script src="ui.js?v=quiet-2"></script><script src="home.js?v=lens-1"></script><noscript><div class="no-script">请启用 JavaScript 以选择案文。</div></noscript></body></html>
